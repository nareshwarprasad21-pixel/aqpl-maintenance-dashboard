name: Apply Machine History Permit Patch

on:
  push:
    paths:
      - '.github/workflows/apply_machine_history_permit_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Machine History permit logic
        run: python .github/scripts/patch_machine_history_permits.py

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit."
          else
            git commit -m "Link hot and height permits from Machine History"
            git push
          fi
