name: Fix Daily Machine Entry Mode

on:
  push:
    paths:
      - '.github/workflows/fix-daily-machine-entry-mode.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move machine mode outside form
        env:
          INSERT_B64: 
          REMOVE_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('app.py'); s=p.read_text(encoding='utf-8'); anchor=\"    with st.form('daily_work_log_form',clear_on_submit=True):\\n\"; ins=base64.b64decode(os.environ['INSERT_B64']).decode('utf-8'); rem=base64.b64decode(os.environ['REMOVE_B64']).decode('utf-8'); assert anchor in s and rem in s; s=s.replace(anchor,ins+anchor,1).replace(rem,'',1); p.write_text(s,encoding='utf-8')"
          python -m py_compile app.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Fix manual machine entry reset in daily work log"
          git push
