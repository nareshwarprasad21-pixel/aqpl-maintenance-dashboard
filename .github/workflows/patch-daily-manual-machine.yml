name: Patch Daily Manual Machine Entry

on:
  push:
    paths:
      - '.github/workflows/patch-daily-manual-machine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Daily Work Log machine entry
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('app.py'); s=p.read_text(encoding='utf-8'); old=base64.b64decode(os.environ['OLD_B64']).decode('utf-8'); new=base64.b64decode(os.environ['NEW_B64']).decode('utf-8'); assert old in s, 'Daily Work Log machine block not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          python -m py_compile app.py
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Add manual unmapped machine entry in daily work log"
          git push
