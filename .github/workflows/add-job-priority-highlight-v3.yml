name: Add Job Priority Highlight V3

on:
  push:
    paths:
      - '.github/workflows/add-job-priority-highlight-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch priority and red critical rows
        run: |
          python -c "import base64; exec(base64.b64decode('').decode())"
          python -m py_compile app.py
      - name: Commit priority feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Add priority and critical highlighting to daily job plan"
          git push
