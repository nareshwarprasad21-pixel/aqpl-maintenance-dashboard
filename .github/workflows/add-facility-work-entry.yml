name: Add Facility Work Entry

on:
  push:
    paths:
      - '.github/workflows/add-facility-work-entry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Daily Work Log for facility jobs
        env:
          NEW_BLOCK_B64: 
          OLD_WORKTYPE_B64: 
          NEW_WORKTYPE_B64: 
          OLD_STATUS_B64: 
          NEW_STATUS_B64: 
          OLD_VALID_B64: ICAgICAgICBlbGlmIGRhaWx5X2NvZGU9PSdfX01JU0NfXycgYW5kIG5vdCBtaXNjX21hY2hpbmVfbmFtZS5zdHJpcCgpOnN0LmVycm9yKCdNaXNjZWxsYW5lb3VzIGVudHJ5IOCkleClhyDgpLLgpL/gpI8gTWFjaGluZSAvIEVxdWlwbWVudCBOYW1lIHJlcXVpcmVkIOCkueCliOClpCcpCg==
          NEW_VALID_B64: ICAgICAgICBlbGlmIGRhaWx5X2NvZGUgaW4gWydfX01JU0NfXycsJ19fRkFDSUxJVFlfXyddIGFuZCBub3QgbWlzY19tYWNoaW5lX25hbWUuc3RyaXAoKTpzdC5lcnJvcignTWFudWFsL0ZhY2lsaXR5IGVudHJ5IOCkleClhyDgpLLgpL/gpI8gTWFjaGluZSAvIEVxdWlwbWVudCBOYW1lIOCkr+CkviBXb3JrIEFyZWEgcmVxdWlyZWQg4KS54KWI4KWkJykK
          OLD_RES_B64: 
          NEW_RES_B64: 
          OLD_META_B64: 
          NEW_META_B64: 
        run: |
          python - <<'PY'
          import os, base64, pathlib
          p=pathlib.Path('app.py')
          s=p.read_text(encoding='utf-8')
          start="    current_minute=datetime.now(ZoneInfo('Asia/Kolkata')).time().replace(second=0,microsecond=0,tzinfo=None)\n"
          end="        w1,w2=st.columns(2); work_type="
          i=s.index(start, s.index("with T[5]:"))
          j=s.index(end, i)
          new_block=base64.b64decode(os.environ['NEW_BLOCK_B64']).decode('utf-8')
          s=s[:i]+new_block+s[j:]
          pairs=[
            ('OLD_WORKTYPE_B64','NEW_WORKTYPE_B64'),
            ('OLD_STATUS_B64','NEW_STATUS_B64'),
            ('OLD_VALID_B64','NEW_VALID_B64'),
            ('OLD_RES_B64','NEW_RES_B64'),
            ('OLD_META_B64','NEW_META_B64'),
          ]
          for a,b in pairs:
              old=base64.b64decode(os.environ[a]).decode('utf-8')
              new=base64.b64decode(os.environ[b]).decode('utf-8')
              assert old in s, f'{a} block not found'
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Add general facility work entries to daily log"
          git push
