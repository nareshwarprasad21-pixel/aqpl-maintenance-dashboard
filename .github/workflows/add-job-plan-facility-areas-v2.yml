name: Add Job Plan Facility Areas V2

on:
  push:
    paths:
      - '.github/workflows/add-job-plan-facility-areas-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add plant areas to Daily Job Plan facility dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          anchor="            'Administration Building',"
          pos=s.find(anchor, s.find("with T[4]:"))
          if pos < 0:
              raise SystemExit('Daily Job Plan facility anchor not found')
          insert="\n            'Ball Mill Area',\n            'MIDAS Area',\n            'Tertiary Crusher Area',\n            'Packing Area',"
          if "'Ball Mill Area'" not in s[pos:pos+500]:
              s=s[:pos+len(anchor)] + insert + s[pos+len(anchor):]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit facility area options
        run: |
          git config user.name "NARESHWAR"
          git config user.email "nareshwar.prasad21@gmail.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Ball Mill MIDAS Tertiary and Packing facility areas"
          git push
