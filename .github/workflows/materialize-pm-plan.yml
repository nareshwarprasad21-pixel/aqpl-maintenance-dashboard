name: Materialize PM Plan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PM plan
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('data/pm_plan.csv.gz.b64').read_text().strip()
          pathlib.Path('data/pm_plan.csv').write_bytes(gzip.decompress(base64.b64decode(src)))
          PY
      - name: Commit materialized CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pm_plan.csv
          git diff --cached --quiet || git commit -m "Materialize AQPL PM plan CSV"
          git push
