name: Materialize PM Plan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PM plan
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('data/pm_plan.csv.gz.b64').read_text().strip()
          pathlib.Path('data/pm_plan.csv').write_bytes(gzip.decompress(base64.b64decode(src)))
          PY
      - name: Patch Daily Work manual machine entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old="""        d1,d2,d3=st.columns([1,1,2])
        work_date=d1.date_input('Work Date',value=TODAY)
        shift=d2.selectbox('Shift',['General','A','B','C'])
        daily_machine_options=MACH.machine_code.tolist()+['__MISC__']
        daily_code=d3.selectbox('Machine',daily_machine_options,format_func=lambda value:'➕ Miscellaneous / Other Machine — type manually' if value=='__MISC__' else f\"{machine_row(value).machine_name} | {value}\")
        if daily_code=='__MISC__':
            mx1,mx2,mx3=st.columns([2,1,1])
            misc_machine_name=mx1.text_input('Machine / Equipment Name *',placeholder='Example: RO Plant, Utility Pump, Welding Machine')
            misc_machine_code=mx2.text_input('Machine Code (optional)',placeholder='Optional')
            misc_location=mx3.text_input('Location / Section',placeholder='Optional')
            st.caption('यह entry Equipment Master में machine add किए बिना Daily Work Log में save होगी।')
        else:
            misc_machine_name=''; misc_machine_code=''; misc_location=''
"""
          new="""        d1,d2=st.columns([1,1])
        work_date=d1.date_input('Work Date',value=TODAY)
        shift=d2.selectbox('Shift',['General','A','B','C'])
        machine_entry_mode=st.radio('Machine Entry',['Select from Equipment Master','Enter Machine Name Manually'],horizontal=True,key='daily_machine_entry_mode')
        if machine_entry_mode=='Enter Machine Name Manually':
            mx1,mx2,mx3=st.columns([2,1,1])
            misc_machine_name=mx1.text_input('Machine / Equipment Name *',placeholder='Example: RO Plant, Utility Pump, Welding Machine')
            misc_machine_code=mx2.text_input('Machine Code (optional)',placeholder='Optional')
            misc_location=mx3.text_input('Location / Section',placeholder='Optional')
            daily_code='__MISC__'
            st.caption('Machine Equipment Master में registered न हो तब भी यहाँ नाम लिखकर miscellaneous maintenance work save कर सकते हैं।')
        else:
            daily_code=st.selectbox('Machine',MACH.machine_code.tolist(),format_func=lambda value:f\"{machine_row(value).machine_name} | {value}\")
            misc_machine_name=''; misc_machine_code=''; misc_location=''
"""
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit materialized CSV and dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pm_plan.csv app.py
          git diff --cached --quiet || git commit -m "Show manual machine name entry in daily work log"
          git push
