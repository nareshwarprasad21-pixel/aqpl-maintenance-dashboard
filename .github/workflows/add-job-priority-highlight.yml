name: Add Job Priority Highlight

on:
  push:
    paths:
      - '.github/workflows/add-job-priority-highlight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch priority and critical highlighting
        env:
          OLD1_B64: ICAgICAgICAgICAgJ0pvYiAvIFByb2JsZW0gRGV0YWlscyc6am9iLnByb2JsZW0sJ0pvYiBUeXBlJzptZXRhLmdldCgnam9iX3R5cGUnLCcnKSwKICAgICAgICAgICAgJ0Fzc2lnbmVkIFRvJzptZXRhLmdldCgnYXNzaWduZWRfdG8nLCcnKSw=
          NEW1_B64: ICAgICAgICAgICAgJ0pvYiAvIFByb2JsZW0gRGV0YWlscyc6am9iLnByb2JsZW0sJ0pvYiBUeXBlJzptZXRhLmdldCgnam9iX3R5cGUnLCcnKSwKICAgICAgICAgICAgJ1ByaW9yaXR5JzptZXRhLmdldCgncHJpb3JpdHknLCdNZWRpdW0nKSwKICAgICAgICAgICAgJ0Fzc2lnbmVkIFRvJzptZXRhLmdldCgnYXNzaWduZWRfdG8nLCcnKSw=
          OLD2_B64: 
          NEW2_B64: 
          OLD3_B64: 
          NEW3_B64: 
          OLD4_B64: 
          NEW4_B64: 
          OLD5_B64: 
          NEW5_B64: 
          OLD6_B64: 
          NEW6_B64: 
          OLD7_B64: 
          NEW7_B64: 
        run: |
          python - <<'PY'
          import os, base64, pathlib
          p=pathlib.Path('app.py')
          s=p.read_text(encoding='utf-8')
          for i in range(1,8):
              old=base64.b64decode(os.environ[f'OLD{i}_B64']).decode('utf-8')
              new=base64.b64decode(os.environ[f'NEW{i}_B64']).decode('utf-8')
              if old not in s:
                  raise SystemExit(f'anchor {i} not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit priority feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Add critical priority highlighting to daily job plan"
          git push
