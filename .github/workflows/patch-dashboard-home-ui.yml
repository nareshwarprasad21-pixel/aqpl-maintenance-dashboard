name: Patch Dashboard Home UI

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-home-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app.py
        env:
          HOME_UI_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('app.py'); s=p.read_text(encoding='utf-8'); marker=\"with T[0]:\\n    st.subheader('Today / Upcoming Maintenance')\\n\"; repl=base64.b64decode(os.environ['HOME_UI_B64']).decode('utf-8'); (None if '### 📊 Maintenance Overview' in s else p.write_text(s.replace(marker,repl,1),encoding='utf-8'))"
          python -m py_compile app.py
      - name: Commit UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Upgrade AQPL maintenance dashboard home UI"
          git push
